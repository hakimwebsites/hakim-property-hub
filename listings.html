<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Properties | Hakim Property Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="container nav"><a class="brand" href="index.html"><span class="logo">H</span><span>Hakim <b>Property
                        Hub</b></span></a>
            <nav><a class="active" href="listings.html">Buy</a><a href="listings.html?mode=rent">Rent</a><a
                    href="listings.html?type=land">Land</a><a href="agents.html">Agents</a></nav>
            <div class="nav-right"><a class="signin" href="mailto:hakimwebsites.ug@gmail.com">Contact</a><a
                    class="btn btn-green" href="list-property.html">List property</a></div><button
                class="menu">☰</button>
        </div>
    </header>
    <section class="page-hero">
        <div class="container"><span class="eyebrow dark">UGANDA PROPERTY</span>
            <h1>Find your next property.</h1>
            <p>Filter the demo inventory by location, type, purpose and bedrooms.</p>
        </div>
    </section>
    <section class="container listings-layout">
        <aside class="filters">
            <div class="filter-head">Filters <button id="clear">Clear</button></div><label>Keyword<input id="keyword"
                    placeholder="e.g. garden, villa"></label><label>Location<select id="location">
                    <option value="">Any location</option>
                    <option>Kampala</option>
                    <option>Wakiso</option>
                    <option>Entebbe</option>
                    <option>Jinja</option>
                    <option>Mbarara</option>
                    <option>Gulu</option>
                    <option>Mukono</option>
                    <option>Hoima</option>
                </select></label><label>Type<select id="type">
                    <option value="">Any type</option>
                    <option value="house">House</option>
                    <option value="apartment">Apartment</option>
                    <option value="land">Land</option>
                    <option value="commercial">Commercial</option>
                </select></label><label>Purpose<select id="mode">
                    <option value="">Any purpose</option>
                    <option value="sale">For sale</option>
                    <option value="rent">For rent</option>
                    <option value="shortlet">Shortlet</option>
                </select></label><label>Bedrooms<select id="beds">
                    <option value="">Any bedrooms</option>
                    <option value="1">1+</option>
                    <option value="2">2+</option>
                    <option value="3">3+</option>
                    <option value="4">4+</option>
                    <option value="5">5+</option>
                </select></label><button id="apply" class="btn btn-green full">Apply filters</button>
        </aside>
        <div class="results">
            <div class="results-head"><span><b id="count">0</b> demo properties</span><select id="sort">
                    <option value="featured">Featured</option>
                    <option value="low">Price: low to high</option>
                    <option value="high">Price: high to low</option>
                </select></div>
            <div id="grid" class="property-grid"></div>
        </div>
    </section>
    <footer>
        <div class="container copyright">© 2026 Hakim Web Studio · <a
                href="mailto:hakimwebsites.ug@gmail.com">hakimwebsites.ug@gmail.com</a> · <a
                href="https://wa.me/971558311047" target="_blank">WhatsApp</a></div>
    </footer>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
